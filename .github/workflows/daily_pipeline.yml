name: Pipeline diario FX QuantLab

on:
  schedule:
    # 05:30 UTC = 07:30 España (CEST, verano) / 06:30 España (CET, invierno)
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions, útil para pruebas

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e .

      - name: Correr pipeline diario
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.ingestion.pipeline

      - name: Commit y push de la base de datos actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fx_quantlab.db
          git diff --staged --quiet || git commit -m "Actualización automática de datos - $(date -u +'%Y-%m-%d')"
          git push