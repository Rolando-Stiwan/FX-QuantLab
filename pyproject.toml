[project]
name = "fx-quantlab"
version = "0.1.0"
description = "FX QuantLab: Pricing, Risk & Analytics Platform"
requires-python = "==3.12.*"

dependencies = [
    "yfinance==0.2.61",
    "fredapi==0.5.2",
    "pandas==2.1.4",
    "numpy==1.26.4",
    "python-dotenv==1.1.1",
    "scipy==1.11.4",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "pydantic==2.10.3",
    "requests==2.32.3",
    "streamlit==1.40.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools==72.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]